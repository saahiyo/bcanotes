<svg width="180" height="180" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mascot-body { fill: black; }
    .mascot-eye { fill: white; }
    @media (prefers-color-scheme: dark) {
      .mascot-body { fill: white; }
      .mascot-eye { fill: black; }
    }
  </style>
  <rect class="mascot-body" x="0" y="15" width="100" height="70" rx="35"/>
  <rect class="mascot-eye" x="34" y="36" width="8" height="28" rx="4"/>
  <rect class="mascot-eye" x="58" y="36" width="8" height="28" rx="4"/>
</svg>
